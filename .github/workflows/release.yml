# Builds page for Windows x64 (amd64) and ARM64 and attaches both to a draft
# GitHub release. Runs when a version tag is pushed (git tag v0.1.0 && git push
# origin v0.1.0); it can also be started by hand to get the zips as artifacts.
#
# PyInstaller can't cross-compile, so each architecture builds on its own runner:
# windows-latest (x64) and windows-11-arm (ARM64, free for public repositories).
# Each zip is a complete portable folder: page.exe plus the official age tools for
# that architecture, downloaded from age's GitHub release and checked against
# pinned SHA-256 checksums.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AGE_VERSION: v1.3.2
  PYTHON_VERSION: "3.14"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            python-arch: x64
            # SHA-256 of age-v1.3.2-windows-amd64.zip (matches GitHub's published digest)
            age-sha256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7
          - arch: arm64
            runner: windows-11-arm
            python-arch: arm64
            # SHA-256 of age-v1.3.2-windows-arm64.zip (matches GitHub's published digest)
            age-sha256: fae351336c8d5f30f93cc3ccdec16d1ed7851d68cdd6656d41955cc31a447c9d
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python-arch }}

      - name: Install the build tools (pinned)
        # PyInstaller 6.21 or older can't package Python 3.14's Tcl/Tk 9.
        run: python -m pip install pyinstaller==6.22.3 customtkinter==6.0.0 tkinterdnd2==0.6.3 pillow==12.3.0

      - name: Check the tag matches the version in the app
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (Select-String -Path page.py -Quiet -Pattern "APP_VERSION\s*=\s*`"$([regex]::Escape($tag.TrimStart('v')))`"")) {
            throw "Tag $tag does not match APP_VERSION in page.py; update it before tagging."
          }

      - name: Get the official age tools (checksum pinned)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "age-$env:AGE_VERSION-windows-${{ matrix.arch }}.zip"
          gh release download $env:AGE_VERSION -R FiloSottile/age -p $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ matrix.age-sha256 }}") { throw "Checksum mismatch for ${zip}: $hash" }
          Expand-Archive $zip -DestinationPath agezip
          # The tools page uses; the age plugins for pq/tag keys aren't needed (age 1.3 has them built in).
          foreach ($tool in "age.exe", "age-keygen.exe", "age-inspect.exe", "age-plugin-batchpass.exe") {
            Copy-Item "agezip\age\$tool" .
          }

      - name: Test (round trips through age.exe required)
        env:
          PAGE_REQUIRE_AGE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build page.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name page
          --icon icon.ico --add-data "icon.ico;."
          --collect-data customtkinter --collect-all tkinterdnd2 --exclude-module numpy
          page.py

      - name: Check the exe's architecture
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist\page.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $want = @{ amd64 = 0x8664; arm64 = 0xAA64 }["${{ matrix.arch }}"]
          if ($machine -ne $want) { throw ("page.exe is machine 0x{0:X}, expected 0x{1:X}" -f $machine, $want) }

      - name: Package the portable folder
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          $name = "page-$version-windows-${{ matrix.arch }}"
          $dir = "pkg\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\page.exe, age.exe, age-keygen.exe, age-inspect.exe, age-plugin-batchpass.exe, icon.ico $dir
          Copy-Item register_context_menu.bat, register_context_menu.ps1, unregister_context_menu.bat, unregister_context_menu.ps1 $dir
          Copy-Item README.md $dir
          # age is BSD-3-Clause: its licence must ship with its binaries.
          Copy-Item agezip\age\LICENSE "$dir\LICENSE-age.txt"
          if (Test-Path LICENSE) { Copy-Item LICENSE $dir }
          # Python, Tcl/Tk and the packages bundled into page.exe need their licences shipped too.
          python tools\third_party_licenses.py
          if ($LASTEXITCODE -ne 0) { throw "third_party_licenses.py failed" }
          Copy-Item THIRD_PARTY_LICENSES.txt $dir
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "$dir\*" -DestinationPath "out\$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: page-windows-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error

  # Separate job, so the build jobs never hold write permissions.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: page-windows-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The exes aren't code-signed. This records which workflow, commit and repo
      # built each zip; check with: gh attestation verify <zip> --repo t0ma5/page
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Create a draft release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --draft \
            --title "page ${{ github.ref_name }}" \
            --notes "Portable page for Windows 10/11, with the official age ${AGE_VERSION} tools included. Download page-${{ github.ref_name }}-windows-amd64.zip for x64 PCs or ...-arm64.zip for ARM64 PCs, unzip, run page.exe. Checksums are in SHA256SUMS.txt."
